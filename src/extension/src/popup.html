<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>InterviewCopilot</title>
    <style>
      body { width: 280px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, sans-serif; display: grid; gap: 8px; }
      input, button { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid #ccc; }
      button { background: #3b4bc8; color: #fff; border: 0; cursor: pointer; }
      .muted { color: #666; font-size: 12px; }
      .error { color: #b42318; }
      [hidden] { display: none !important; }
      @media (prefers-color-scheme: dark) { body { background: #1d1f27; color: #eee; } }
    </style>
  </head>
  <body>
    <strong>InterviewCopilot</strong>
    <form id="pair" hidden>
      <div style="display: grid; gap: 6px">
        <input id="code" aria-label="Pairing code" placeholder="6-digit pairing code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required />
        <button type="submit">Pair</button>
        <span class="muted">In the desktop app, open Settings, then Paired browsers, and click Pair a browser. The desktop app must be running.</span>
      </div>
    </form>
    <section id="paired" hidden>
      <p id="sessions" class="muted"></p>
      <button id="unpair" type="button">Unpair</button>
    </section>
    <p id="error" class="error" role="alert"></p>
    <script src="popup.js"></script>
  </body>
</html>
